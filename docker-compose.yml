services:
  kirana:
    build:
      context: .
      args: []
    image: kirana:local-node
    container_name: kirana
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - APP_ORIGIN=http://localhost:8080
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
      - LOG_LEVEL=info
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
